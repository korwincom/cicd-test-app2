name: CI/CD Build and Push

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ] # PR 생성, 코드 추가 푸시, 다시 열림 시 작동
env:
  APP_NAME: cicd-test-app
  DOCKER_IMAGE: legend03/cicd-test-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Java application with Gradle
        run: ./gradlew clean build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Image Tag
        id: image_tag
        run: |
          DATE_TIME=$(TZ=Asia/Seoul date +'%y%m%d.%H%M')
          HASH=$(git rev-parse --short HEAD)
          
          # 💡 PR 이벤트일 경우 Target 브랜치(main)를 가져오고, 그 외엔 현재 브랜치명 사용
          BRANCH="${{ github.base_ref || github.ref_name }}"
          
          # 만약 브랜치명에 슬래시(/)가 포함되어 있다면 대시(-)로 안전하게 변환
          SAFE_BRANCH=$(echo "${BRANCH}" | tr '/' '-')
          
          # 최종 태그 조합 (예: v260728.1047-c6c8053-main)
          TAG_NAME="v${DATE_TIME}-${HASH}-${SAFE_BRANCH}"
          
          echo "IMAGE_TAG=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Generated Tag: ${TAG_NAME}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.image_tag.outputs.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest

      # ------------------------------------------------------------------
      # 🔥 [수정] External Repository (korwincom/k8s-manifests) 업데이트
      # ------------------------------------------------------------------
      - name: Checkout k8s-manifests repository
        uses: actions/checkout@v4
        with:
          repository: 'korwincom/k8s-manifests'
          token: ${{ secrets.K8S_MANIFEST_TOKEN }}
          path: 'k8s-manifests-repo' # k8s-manifests 저장소를 임시로 폴더로 가져옵니다.

      - name: Update k8s deployment manifest & Push
        run: |
          FULL_IMAGE="${{ env.DOCKER_IMAGE }}:${{ steps.image_tag.outputs.IMAGE_TAG }}"
          
          # 가져온 k8s-manifests 저장소 내부의 deployment.yaml 경로 지정
          # (만약 k8s-manifests 저장소의 최상위에 deployment.yaml이 있다면 아래 경로를 "k8s-manifests-repo/deployment.yaml" 로 바꿔주세요!)
          MANIFEST_FILE="k8s-manifests-repo/deployment.yaml"
          
          # yq 도구를 사용해 image 태그 수정
          yq -i ".spec.template.spec.containers[0].image = \"${FULL_IMAGE}\"" ${MANIFEST_FILE}
          
          # k8s-manifests 저장소 폴더로 이동하여 Git 커밋 & 푸시 진행
          cd k8s-manifests-repo
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          
          git add .
          git commit -m "chore: update image to ${FULL_IMAGE} [skip ci]"
          git push
